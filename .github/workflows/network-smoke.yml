name: Network smoke tests

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow reportlab gdown requests pytest
      - run: python -m pytest tests/ -m network -q --tb=short
